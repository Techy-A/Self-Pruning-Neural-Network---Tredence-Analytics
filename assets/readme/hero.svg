<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Self-Pruning Neural Network</title><desc id="d">A PyTorch network for CIFAR-10 in which every weight has a learnable gate. A sparsity penalty drives the gates it can toward zero during training, so the network removes its own weights.</desc>
