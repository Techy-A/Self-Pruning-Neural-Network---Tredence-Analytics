<text x="64" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#0F1B2D" text-anchor="start" >Self-Pruning</text>
